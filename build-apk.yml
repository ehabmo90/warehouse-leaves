name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Create build environment file
        run: cp .env.example .env

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Show generated APK
        run: find . -type f -path "*/build/outputs/apk/debug/*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leaves-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
